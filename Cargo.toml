[package]
name = "alias-management"
version = "0.0.1"
edition = "2024"
description = "am - manage personal bash aliases stored in ~/.alias-management"

[[bin]]
name = "am"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
comfy-table = "7.2"
dialoguer = "0.12"
regex = "1.13"
shellexpand = "3.1"
